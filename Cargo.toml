[package]
name = "border_loss"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "border-loss"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
rstest = "0.27.0"
test-case = "3.4.0"
